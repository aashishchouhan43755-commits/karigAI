version: '3.8'

services:
  karigai-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: karigai-prototype
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - FAIR_WAGE_HOURLY_BASE_INR=180
    restart: unless-stopped
